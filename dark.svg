<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Sayak Satpathi — AI/ML and software engineering student at SMIT; building across applied AI/ML, retrieval systems, security tooling and cloud-native software.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/><stop offset="0.6" stop-color="#07111F"/><stop offset="1" stop-color="#0B1220"/>
  </linearGradient>
  <linearGradient id="asciiGrad" x1="0" y1="150" x2="0" y2="465.0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset="0.5" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#22D3EE"/>
    <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#3b82f6" stop-opacity="0.14"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="portraitClip"><rect x="52" y="112" width="400" height="360" rx="8"/></clipPath>
</defs>

<rect width="1180" height="610" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1178" height="608" rx="21" fill="none" stroke="#1e2b44" stroke-width="1.5"/>

