<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="'JetBrains Mono',monospace" role="img" aria-label="A floating 3D isometric cube with an orbiting ring of technology icons">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171436"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#6ad7ff"/></linearGradient>
    <linearGradient id="lft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B026FF"/><stop offset="1" stop-color="#6a14a0"/></linearGradient>
    <linearGradient id="rgt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E63946"/><stop offset="1" stop-color="#8f1f29"/></linearGradient>
    <style>
      .cube{transform-box:view-box;transform-origin:220px 150px;animation:fl 4s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      .shine{animation:sh 3s ease-in-out infinite}
      @keyframes sh{0%,100%{opacity:.15}50%{opacity:.5}}
      @media (prefers-reduced-motion:reduce){.cube{animation:none}.shine{animation:none}.orbit{display:none}}
    </style>
  </defs>
  <rect width="440" height="300" rx="16" fill="url(#cbg)" stroke="#302b63" stroke-width="2"/>

  <!-- orbit ring -->
  <ellipse cx="220" cy="150" rx="170" ry="60" fill="none" stroke="#302b63" stroke-width="1.5" stroke-dasharray="4 8"/>
  <g class="orbit">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 220 150" to="360 220 150" dur="14s" repeatCount="indefinite"/>
      <g font-size="13" font-weight="700">
        <g transform="translate(390,150)"><circle r="15" fill="#11182a" stroke="#00F5FF" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" fill="#00F5FF">PY</text></g>
        <g transform="translate(50,150)"><circle r="15" fill="#11182a" stroke="#E63946" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" fill="#E63946">ML</text></g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 220 150" to="540 220 150" dur="14s" repeatCount="indefinite"/>
      <g font-size="12" font-weight="700">
        <g transform="translate(390,150)"><circle r="15" fill="#11182a" stroke="#FFD23F" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" fill="#FFD23F">JS</text></g>
        <g transform="translate(50,150)"><circle r="14" fill="#11182a" stroke="#B026FF" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" fill="#B026FF">K8s</text></g>
      </g>
    </g>
  </g>

  <!-- isometric cube -->
  <g class="cube">
    <polygon points="220,70 300,116 220,162 140,116" fill="url(#top)" stroke="#0d1117" stroke-width="2"/>
    <polygon points="140,116 220,162 220,244 140,198" fill="url(#lft)" stroke="#0d1117" stroke-width="2"/>
    <polygon points="300,116 220,162 220,244 300,198" fill="url(#rgt)" stroke="#0d1117" stroke-width="2"/>
    <polygon class="shine" points="220,70 300,116 220,162 140,116" fill="#ffffff"/>
    <text x="180" y="190" font-size="16" font-weight="800" fill="#fff" opacity="0.9">&lt;/&gt;</text>
    <text x="250" y="190" font-size="15" font-weight="800" fill="#fff" opacity="0.9">{ }</text>
  </g>

  <text x="220" y="286" text-anchor="middle" font-size="12" fill="#8b93a7">build · ship · repeat</text>
</svg>
