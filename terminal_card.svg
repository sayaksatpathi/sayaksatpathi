<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="'JetBrains Mono','Courier New',monospace" role="img" aria-label="Terminal running sayak --whoami, printing role, focus, location and fuel">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11162a"/><stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <style>
      .ln{opacity:0}
      .l1{animation:ap .01s linear .4s forwards}
      .l2{animation:ap .01s linear 1.1s forwards}
      .l3{animation:ap .01s linear 1.8s forwards}
      .l4{animation:ap .01s linear 2.5s forwards}
      .l5{animation:ap .01s linear 3.2s forwards}
      .l6{animation:ap .01s linear 3.9s forwards}
      @keyframes ap{to{opacity:1}}
      .cur{animation:bk 1s step-end infinite}
      @keyframes bk{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.ln{opacity:1}.cur{animation:none}}
    </style>
  </defs>
  <rect width="600" height="340" rx="14" fill="url(#tbg)" stroke="#302b63" stroke-width="2"/>
  <!-- title bar -->
  <rect width="600" height="40" rx="14" fill="#1b2336"/>
  <rect y="20" width="600" height="20" fill="#1b2336"/>
  <circle cx="24" cy="20" r="6" fill="#E63946"/>
  <circle cx="46" cy="20" r="6" fill="#FFD23F"/>
  <circle cx="68" cy="20" r="6" fill="#2ecc71"/>
  <text x="300" y="25" text-anchor="middle" font-size="13" fill="#8b93a7">sayak@dev: ~</text>
  <!-- body -->
  <g font-size="15">
    <text x="20" y="78" fill="#2ecc71">$ <tspan fill="#c9d1d9">sayak --whoami</tspan></text>
    <text class="ln l1" x="20" y="112" fill="#00F5FF">role      <tspan fill="#c9d1d9">: AI/ML student &amp; Full-Stack Dev</tspan></text>
    <text class="ln l2" x="20" y="140" fill="#B026FF">focus     <tspan fill="#c9d1d9">: Computer Vision · MLOps · Web</tspan></text>
    <text class="ln l3" x="20" y="168" fill="#FFD23F">location  <tspan fill="#c9d1d9">: India  (UTC+5:30)</tspan></text>
    <text class="ln l4" x="20" y="196" fill="#00F5FF">building  <tspan fill="#c9d1d9">: things that detect, decide, deploy</tspan></text>
    <text class="ln l5" x="20" y="224" fill="#B026FF">fuel      <tspan fill="#c9d1d9">: chai + curiosity + clean commits</tspan></text>
    <text class="ln l6" x="20" y="252" fill="#FFD23F">status    <tspan fill="#2ecc71">: open to collaborate ●</tspan></text>
    <text x="20" y="292" fill="#2ecc71">$ <tspan class="cur" fill="#c9d1d9">▋</tspan></text>
  </g>
</svg>
