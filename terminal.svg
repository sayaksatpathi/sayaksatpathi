<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="'JetBrains Mono','Courier New',monospace" role="img" aria-label="An animated terminal session: whoami, git log, and today's status for Sayak Satpathi.">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <style>
      .ln{opacity:0}
      .l1{animation:ap .01s linear .5s forwards}.o1{animation:ap .3s ease 1.0s forwards}
      .l2{animation:ap .01s linear 1.7s forwards}.o2{animation:ap .3s ease 2.2s forwards}
      .l3{animation:ap .01s linear 2.9s forwards}.o3{animation:ap .3s ease 3.4s forwards}
      .l4{animation:ap .01s linear 4.1s forwards}
      @keyframes ap{to{opacity:1}}
      .cur{animation:bk 1.05s step-end infinite}
      @keyframes bk{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.ln{opacity:1}.cur{animation:none}}
    </style>
  </defs>
  <rect width="860" height="320" rx="14" fill="url(#tbg)" stroke="#1e2b44" stroke-width="2"/>
  <rect width="860" height="42" rx="14" fill="#0F172A"/><rect y="21" width="860" height="21" fill="#0F172A"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/><circle cx="48" cy="21" r="6" fill="#ffbd2e"/><circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="430" y="26" text-anchor="middle" font-size="13" fill="#94A3B8">sayak@dev: ~/profile — zsh</text>

  <g font-size="15">
    <text x="22" y="82" fill="#10B981">$ <tspan fill="#F8FAFC">whoami</tspan></text>
    <text class="ln o1" x="22" y="108" fill="#22D3EE">→ sayak — AI/ML &amp; software-engineering student @ SMIT, learning in the open</text>

    <text class="ln l2" x="22" y="146" fill="#10B981">$ <tspan fill="#F8FAFC">git log --oneline -1</tspan></text>
    <text class="ln o2" x="22" y="172" fill="#7C3AED">→ feat: ship tools that <tspan fill="#F8FAFC">detect · decide · deploy</tspan></text>

    <text class="ln l3" x="22" y="210" fill="#10B981">$ <tspan fill="#F8FAFC">cat status.json</tspan></text>
    <text class="ln o3" x="22" y="236" fill="#F8FAFC">→ { <tspan fill="#22D3EE">"focus"</tspan>: "AI/ML · RAG · security · cloud-native", <tspan fill="#22D3EE">"oss"</tspan>: <tspan fill="#10B981">"6 PRs merged"</tspan> }</text>

    <text class="ln l4" x="22" y="278" fill="#10B981">$ <tspan class="cur" fill="#F8FAFC">▋</tspan></text>
  </g>
</svg>
